<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Entrada acceptada · Festa 40 + 40</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    background:
        linear-gradient(
            rgba(0,0,0,0.60),
            rgba(0,0,0,0.75)
        ),
        url("foto.jpg") center center / cover fixed;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
    text-align: center;
}

.pantalla {
    width: 100%;
    max-width: 520px;
    padding: 25px 20px;
}

.targeta {
    background: rgba(255,255,255,0.96);
    color: #111;

    border-radius: 22px;
    padding: 30px 22px;

    box-shadow:
        0 15px 50px rgba(0,0,0,0.65);

    animation: entrada 0.7s ease-out;
}

@keyframes entrada {
    from {
        opacity: 0;
        transform: scale(0.85);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.check {
    width: 82px;
    height: 82px;

    margin: 0 auto 18px;

    border-radius: 50%;

    background: #18a558;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 48px;
    font-weight: bold;

    box-shadow: 0 5px 20px rgba(24,165,88,0.4);
}

.acceptada {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.estat {
    color: #18a558;
    font-size: 15px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.separador {
    height: 1px;
    background: #ddd;
    margin: 25px 0;
}

.festa {
    font-size: 28px;
    font-weight: 900;
}

.data {
    margin-top: 8px;
    color: #666;
    font-size: 14px;
}

.benvinguts {
    margin-top: 25px;

    font-size: 28px;
    font-weight: 900;

    animation: pols 1.5s infinite;
}

@keyframes pols {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

.animacio {
    margin-top: 20px;
    max-width: 100%;
    border-radius: 15px;
}

.boto-musica {
    margin-top: 25px;

    border: none;
    border-radius: 50px;

    padding: 15px 25px;

    background: #111;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.boto-musica:active {
    transform: scale(0.96);
}

.peu {
    margin-top: 20px;
    font-size: 11px;
    color: #777;
}
</style>
</head>

<body>

<div class="pantalla">

    <div class="targeta">

        <div class="check">
            ✓
        </div>

        <div class="acceptada">
            ENTRADA ACCEPTADA
        </div>

        <div class="estat">
            ACCÉS AUTORITZAT
        </div>

        <div class="separador"></div>

        <div class="festa">
            40 + 40
        </div>

        <div class="data">
            Entrada vàlida · Festa privada
        </div>

        <div class="benvinguts">
            🎉 BENVINGUTS A LA FESTA! 🎉
