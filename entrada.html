<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Entrada acceptada</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background:
        linear-gradient(
            rgba(0,0,0,0.55),
            rgba(0,0,0,0.75)
        ),
        url("foto.jpg") center center / cover fixed;

    color: white;
    text-align: center;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;
}

.pantalla {
    width: 100%;
    max-width: 520px;
    padding: 25px 20px;
}

.targeta {
    background: rgba(255,255,255,0.96);
    color: #111;

    border-radius: 22px;

    padding: 30px 20px;

    box-shadow:
        0 15px 50px rgba(0,0,0,0.7);

    animation: entrada 0.7s ease-out;
}

@keyframes entrada {
    from {
        opacity: 0;
        transform: scale(0.85);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.check {
    width: 85px;
    height: 85px;

    margin: 0 auto 18px;

    border-radius: 50%;

    background: #18a558;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 52px;
    font-weight: bold;
}

.acceptada {
    font-size: 29px;
    font-weight: 900;
}

.autorizat {
    margin-top: 8px;

    color: #18a558;

    font-size: 14px;
    font-weight: bold;

    letter-spacing: 2px;
}

.separador {
    height: 1px;
    background: #ddd;
    margin: 25px 0;
}

.festa {
    font-size: 30px;
    font-weight: 900;
}

.benvinguts {
    margin-top: 25px;

    font-size: 27px;
    font-weight: 900;

    animation: pols 1.4s infinite;
}

@keyframes pols {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

.instruccio {
    margin-top: 25px;

    font-size: 14px;
    color: #555;
}

.animacio {
    display: block;

    width: 100%;
    max-width: 350px;

    margin: 20px auto 0;

    border-radius: 15px;
}

</style>
</head>

<body>

<div class="pantalla">

    <div class="targeta">

        <div class="check">
            ✓
        </div>

        <div class="acceptada">
            ENTRADA ACCEPTADA
        </div>

        <div class="autorizat">
            ACCÉS AUTORITZAT
        </div>

        <div class="separador"></div>

        <div class="festa">
            40 + 40
        </div>

        <div class="benvinguts">
            🎉 BENVINGUTS A LA FESTA! 🎉
        </div>

        <!--
        Quan tinguem l'animació definitiva,
        podem posar-la aquí:
        
        <img src="animacio.gif" class="animacio">
        -->

        <div class="instruccio">
            👆 Toca la pantalla per començar
        </div>

    </div>

</div>

<!-- MÚSICA -->
<audio id="musica" preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

let musicaIniciada = false;

function iniciarMusica() {

    if (musicaIniciada) return;

    const musica = document.getElementById("musica");

    musicaIniciada = true;

    musica.play().catch(function(error) {
        musicaIniciada = false;
        console.log("No s'ha pogut iniciar la música:", error);
    });
}

/* QUALsevol toc de pantalla inicia la música */
document.addEventListener("click", iniciarMusica);
document.addEventListener("touchstart", iniciarMusica, { passive: true });

</script>

</body>
</html>
