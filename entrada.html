<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>40+40</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #000;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

.contenidor {
  width: 100%;
  max-width: 650px;
  margin: auto;
  padding: 25px 18px 40px;
  text-align: center;
}

/* TÍTOL */

.titol {
  font-size: clamp(70px, 20vw, 120px);
  font-weight: 900;
  line-height: .8;
  letter-spacing: -6px;
  margin: 15px 0 25px;
}

/* FOTO */

.foto {
  width: 100%;
  display: block;
  border-radius: 8px;
  margin-bottom: 30px;

  /* dona un aspecte una mica més de fotografia antiga */
  filter: contrast(1.05) saturate(.85);
}

/* TEXT */

.text {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 18px;
}

/* QR */

.qr-enllac {
  display: inline-block;
  background: white;
  padding: 14px;
  border-radius: 12px;
  box-shadow: 0 0 30px rgba(255,255,255,.25);
  transition: transform .15s ease;
}

.qr-enllac:active {
  transform: scale(.94);
}

#qrcode img,
#qrcode canvas {
  display: block;
  width: min(70vw, 360px) !important;
  height: min(70vw, 360px) !important;
}

.instruccio {
  margin-top: 20px;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.4;
}

.petit {
  margin-top: 25px;
  font-size: 13px;
  opacity: .55;
}

</style>
</head>

<body>

<div class="contenidor">

  <div class="titol">
    40+40
  </div>

  <img
    src="foto.jpg"
    class="foto"
    alt="40+40"
  >

  <div class="text">
    ESCANEJA L'ENTRADA
  </div>

  <!-- QR CLICABLE -->
  <a
    class="qr-enllac"
    href="https://josep86.github.io/Festa40/"
    aria-label="Obrir l'entrada de la festa"
  >
    <div id="qrcode"></div>
  </a>

  <div class="instruccio">
    📱 Escaneja el QR<br>
    i entra a la festa
  </div>

  <div class="petit">
    🎉 40+40 🎉
  </div>

</div>


<!-- Biblioteca per crear el QR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

new QRCode(document.getElementById("qrcode"), {
  text: "https://josep86.github.io/Festa40/",
  width: 360,
  height: 360,
  colorDark: "#000000",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.H
});

</script>

</body>
</html>
