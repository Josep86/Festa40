<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>40 + 40</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

/* FOTO */
.foto-container {
    position: relative;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
}

.foto {
    width: 100%;
    display: block;
}

/* 40 + 40 */
.titol {
    position: absolute;

    top: 8%;
    left: 0;
    width: 100%;

    text-align: center;

    color: #FFD900;

    font-size: clamp(60px, 17vw, 100px);
    font-weight: 900;

    line-height: 1;
    letter-spacing: -5px;

    text-shadow:
        0 4px 8px rgba(0,0,0,0.8),
        0 0 15px rgba(0,0,0,0.45);
}

/* QR */
.qr-box {
    width: fit-content;

    background: white;

    padding: 15px;
    margin: 25px auto 35px;

    border-radius: 16px;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.6);
}

.qr {
    width: 280px;
    max-width: 70vw;
    height: auto;

    display: block;
}

</style>
</head>

<body>

<div class="foto-container">

    <img
        src="foto.jpg"
        alt=""
        class="foto"
    >

    <div class="titol">
        40 + 40
    </div>

</div>

<div class="qr-box">

    <img
        src="qr_festa40.png"
        alt="QR"
        class="qr"
    >

</div>

</body>
</html>
