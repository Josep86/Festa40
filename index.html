<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>40 + 40</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

.contenidor {
    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding-bottom: 35px;
}

/* TÍTOL */
.titol {
    color: white;
    font-size: clamp(60px, 17vw, 100px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -5px;

    padding: 25px 10px 20px;

    text-align: center;

    text-shadow:
        0 4px 12px rgba(0,0,0,0.8);
}

/* FOTO */
.foto {
    width: 100%;
    max-width: 700px;
    display: block;

    object-fit: cover;
}

/* QR */
.qr-box {
    background: white;

    padding: 15px;
    margin-top: 25px;

    border-radius: 16px;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.5);
}

.qr {
    width: 280px;
    max-width: 70vw;
    height: auto;

    display: block;
}

</style>
</head>

<body>

<div class="contenidor">

    <div class="titol">
        40 + 40
    </div>

    <img
        src="foto.jpg"
        alt=""
        class="foto"
    >

    <div class="qr-box">
        <img
            src="qr_festa40.png"
            alt="QR"
            class="qr"
        >
    </div>

</div>

</body>
</html>
