<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FESTA 40</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .pantalla {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      padding: 35px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: clamp(55px, 18vw, 110px);
      line-height: 0.85;
      margin: 0 0 25px;
      font-weight: 900;
      letter-spacing: -5px;
    }

    h2 {
      font-size: 28px;
      margin: 0 0 15px;
    }

    p {
      font-size: 19px;
      line-height: 1.4;
      margin: 8px 0;
    }

    .subtitol {
      font-size: 18px;
      opacity: 0.75;
      margin-bottom: 40px;
    }

    button {
      border: 3px solid #fff;
      background: #fff;
      color: #000;
      font-size: 22px;
      font-weight: 900;
      padding: 18px 35px;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 25px;
      transition: transform 0.15s;
    }

    button:active {
      transform: scale(0.94);
    }

    #benvinguda {
      display: none;
    }

    .gran {
      font-size: clamp(45px, 14vw, 90px);
      font-weight: 900;
      line-height: 0.9;
      margin-bottom: 25px;
    }

    .emoji {
      font-size: 70px;
      margin: 15px 0;
      animation: saltar 0.7s infinite alternate;
    }

    @keyframes saltar {
      from {
        transform: translateY(0) rotate(-5deg);
      }
      to {
        transform: translateY(-18px) rotate(5deg);
      }
    }

    .petit {
      font-size: 16px;
      opacity: 0.65;
      margin-top: 35px;
    }

    .confeti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: none;
      overflow: hidden;
    }

    .confeti span {
      position: absolute;
      top: -20px;
      font-size: 25px;
      animation: caure linear forwards;
    }

    @keyframes caure {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }
  </style>
</head>

<body>

  <div id="entrada" class="pantalla">

    <h1>FESTA<br>40</h1>

    <p>Has trobat l'entrada secreta.</p>

    <div class="subtitol">
      Ara només falta una cosa...
    </div>

    <button onclick="entrar()">
      ENTRAR A LA FESTA
    </button>

    <div class="petit">
      🔊 Posa el volum una mica alt
    </div>

  </div>


  <div id="benvinguda" class="pantalla">

    <div class="emoji">🎉</div>

    <div class="gran">
      BENVINGUT!
    </div>

    <h2>ARA SÍ.</h2>

    <p>
      Ja ets oficialment dins<br>
      de la FESTA 40.
    </p>

    <p>
      🕺💃🍻
    </p>

    <div class="petit">
      Ensenya aquesta pantalla al Nord 😎
    </div>

  </div>


  <div id="confeti" class="confeti"></div>


  <!--
    Quan tinguem la música preparada,
    descomenta aquesta línia i posa aquí
    el nom del fitxer MP3:
    
    <audio id="musica" src="musica.mp3"></audio>
  -->


  <script>

    function entrar() {

      // Amaguem la pantalla inicial
      document.getElementById("entrada").style.display = "none";

      // Mostrem la pantalla de benvinguda
      document.getElementById("benvinguda").style.display = "flex";

      // Activem el confeti
      crearConfeti();

      // Intentem reproduir la música
      // Quan afegim l'MP3, activarem aquesta part.

      /*
      const musica = document.getElementById("musica");
      musica.play();
      */

    }


    function crearConfeti() {

      const contenidor = document.getElementById("confeti");

      contenidor.style.display = "block";

      const simbols = ["🎉", "🎊", "🥳", "✨", "🔥", "💥"];

      for (let i = 0; i < 45; i++) {

        const tros = document.createElement("span");

        tros.innerHTML =
          simbols[Math.floor(Math.random() * simbols.length)];

        tros.style.left =
          Math.random() * 100 + "%";

        tros.style.animationDuration =
          (2 + Math.random() * 4) + "s";

        tros.style.animationDelay =
          Math.random() * 1.5 + "s";

        contenidor.appendChild(tros);
      }
    }

  </script>

</body>
</html>
