<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FESTA 40</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #000;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

.pantalla {
  min-height: 100vh;
  width: 100%;
  max-width: 650px;
  margin: auto;
  padding: 30px 25px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

#benvinguda {
  display: none;
}

h1 {
  font-size: clamp(60px, 20vw, 120px);
  line-height: .8;
  margin: 0 0 30px;
  font-weight: 900;
  letter-spacing: -6px;
}

.subtitol {
  font-size: 20px;
  margin-bottom: 35px;
}

button {
  border: 0;
  background: white;
  color: black;
  font-size: 21px;
  font-weight: 900;
  padding: 19px 30px;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 0 0 0 rgba(255,255,255,.5);
  animation: pulsar 1.4s infinite;
}

button:active {
  transform: scale(.92);
}

@keyframes pulsar {
  0% {
    box-shadow: 0 0 0 0 rgba(255,255,255,.5);
  }
  70% {
    box-shadow: 0 0 0 18px rgba(255,255,255,0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(255,255,255,0);
  }
}


/* -------------------------
   BENVINGUDA
------------------------- */

.gran {
  font-size: clamp(50px, 15vw, 100px);
  font-weight: 900;
  line-height: .85;
  margin-bottom: 20px;
  animation: entrada 0.6s ease-out;
}

@keyframes entrada {
  0% {
    transform: scale(3) rotate(-8deg);
    opacity: 0;
  }

  70% {
    transform: scale(.9) rotate(3deg);
  }

  100% {
    transform: scale(1) rotate(0);
    opacity: 1;
  }
}


/* -------------------------
   ANIMACIÓ TIPUS GIF
------------------------- */

.gif-festa {
  width: 190px;
  height: 190px;
  margin-bottom: 20px;
  position: relative;
  animation: gir 1.5s infinite linear;
}

.gif-festa .cara {
  width: 150px;
  height: 150px;
  background: white;
  color: black;
  border-radius: 50%;
  position: absolute;
  left: 20px;
  top: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 65px;
}

.gif-festa .estrelles {
  position: absolute;
  inset: 0;
  font-size: 30px;
  animation: estrelles 0.7s infinite alternate;
}

@keyframes gir {
  0% {
    transform: rotate(-8deg) scale(1);
  }

  50% {
    transform: rotate(8deg) scale(1.08);
  }

  100% {
    transform: rotate(-8deg) scale(1);
  }
}

@keyframes estrelles {
  from {
    transform: scale(.8) rotate(0deg);
  }

  to {
    transform: scale(1.2) rotate(20deg);
  }
}


/* -------------------------
   CONFETI
------------------------- */

#confeti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.confeti {
  position: absolute;
  top: -40px;
  font-size: 25px;
  animation: caure linear forwards;
}

@keyframes caure {
  to {
    transform:
      translateY(110vh)
      rotate(720deg);
  }
}


/* -------------------------
   TEXT FINAL
------------------------- */

.final {
  font-size: 22px;
  line-height: 1.4;
  margin-top: 10px;
}

.petit {
  font-size: 15px;
  opacity: .65;
  margin-top: 30px;
}

</style>
</head>


<body>


<!-- =====================
     PANTALLA INICIAL
===================== -->

<div id="entrada" class="pantalla">

  <h1>
    FESTA<br>
    40
  </h1>

  <div class="subtitol">
    Has trobat l'entrada secreta.
  </div>

  <button onclick="entrar()">
    🎟️ ENTRAR A LA FESTA
  </button>

  <div class="petit">
    🔊 Puja el volum
  </div>

</div>



<!-- =====================
     PANTALLA BENVINGUDA
===================== -->

<div id="benvinguda" class="pantalla">

  <div class="gif-festa">

    <div class="cara">
      🥳
    </div>

    <div class="estrelles">
      ✨　　　　　 ✨
      <br><br>
      💥　　　　　 💥
    </div>

  </div>


  <div class="gran">
    BENVINGUT!
  </div>


  <div class="final">
    🎉 Ja ets dins de la<br>
    <strong>FESTA 40</strong>
  </div>


  <div class="petit">
    Ensenya aquesta pantalla en Nord 😎
  </div>

</div>


<!-- CONFETI -->

<div id="confeti"></div>


<!-- =====================
     MÚSICA
===================== -->

<audio id="musica" preload="auto">
  <source src="musica.mp3" type="audio/mpeg">
</audio>



<script>

function entrar() {

  /* Canviar pantalla */

  document.getElementById("entrada").style.display = "none";

  document.getElementById("benvinguda").style.display = "flex";


  /* Música */

  const musica = document.getElementById("musica");

  musica.volume = 1;

  musica.currentTime = 0;

  musica.play().catch(function(error) {
    console.log("El navegador ha bloquejat la música:", error);
  });


  /* Confeti */

  crearConfeti();

}



/* -------------------------
   CREAR CONFETI
------------------------- */

function crearConfeti() {

  const contenidor =
    document.getElementById("confeti");

  const simbols = [
    "🎉",
    "🎊",
    "🥳",
    "🔥",
    "💥",
    "✨",
    "🕺",
    "💃"
  ];


  for (let i = 0; i < 60; i++) {

    const tros =
      document.createElement("div");

    tros.className = "confeti";

    tros.innerHTML =
      simbols[
        Math.floor(
          Math.random() * simbols.length
        )
      ];


    tros.style.left =
      Math.random() * 100 + "%";


    tros.style.animationDuration =
      (2 + Math.random() * 4) + "s";


    tros.style.animationDelay =
      Math.random() * 1.5 + "s";


    contenidor.appendChild(tros);

  }

}

</script>


</body>
</html>
