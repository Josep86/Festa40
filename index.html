<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>40 + 40</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
        background:
            linear-gradient(
                rgba(0,0,0,0.28),
                rgba(0,0,0,0.48)
            ),
            url("foto.jpg") center center / cover fixed;
        
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
    }

    .contenidor {
        width: 100%;
        max-width: 520px;
        min-height: 100vh;
        padding: 35px 20px 40px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
    }

    .titol {
        margin-top: 10px;
        font-size: clamp(58px, 16vw, 92px);
        font-weight: 900;
        letter-spacing: -4px;
        line-height: 0.9;

        text-shadow:
            0 4px 10px rgba(0,0,0,0.8),
            0 0 25px rgba(0,0,0,0.5);
    }

    .subtitol {
        margin-top: 15px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 3px;
        text-transform: uppercase;

        text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }

    .qr-box {
        background: white;
        padding: 16px;
        border-radius: 18px;

        box-shadow:
            0 8px 30px rgba(0,0,0,0.6);

        margin: 30px 0 20px;
    }

    .qr {
        display: block;
        width: 270px;
        max-width: 65vw;
        height: auto;
    }

    .text-qr {
        font-size: 15px;
        font-weight: bold;
        margin-top: 15px;

        text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    .peu {
        font-size: 12px;
        opacity: 0.85;
        margin-top: 20px;
        text-shadow: 0 2px 5px rgba(0,0,0,0.9);
    }

</style>
</head>

<body>

<div class="contenidor">

    <div>
        <div class="titol">
            40 + 40
        </div>

        <div class="subtitol">
            Una festa molt especial
        </div>
    </div>


    <div>
        <div class="qr-box">
            <img
                src="qr_festa40.png"
                alt="QR de l'entrada"
                class="qr"
            >
        </div>

        <div class="text-qr">
            ESCANEJA EL QR<br>
            PER ACCEDIR A LA FESTA
        </div>
    </div>


    <div class="peu">
        🎉 Preparats per celebrar-ho?
    </div>

</div>

</body>
</html>
